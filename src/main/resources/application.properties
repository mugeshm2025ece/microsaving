spring.application.name=microsave

# MySQL connection. Override credentials with MYSQL_USER and MYSQL_PASSWORD.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/microsave?serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Mugesh@12121}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development schema management and SQL logging.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=DEBUG
